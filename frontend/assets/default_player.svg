<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="4" />

  <!-- Inner Soft Glow -->
  <circle cx="80" cy="80" r="70" fill="#ffffff" opacity="0.6" />

  <!-- Player Silhouette -->
  <g transform="translate(0, 4)">
    <!-- Head -->
    <circle cx="80" cy="52" r="22" fill="url(#bodyGrad)" />
    
    <!-- Hair / Head Contour -->
    <path d="M 62 48 C 62 34 70 26 80 26 C 90 26 98 34 98 48 C 98 42 90 32 80 32 C 70 32 62 42 62 48 Z" fill="#0f172a" />
    
    <!-- Neck -->
    <rect x="74" y="70" width="12" height="12" rx="4" fill="url(#bodyGrad)" />

    <!-- Jersey Shoulders & Body -->
    <path d="M 38 126 C 38 96 52 80 72 80 L 88 80 C 108 80 122 96 122 126 C 112 136 96 142 80 142 C 64 142 48 136 38 126 Z" fill="url(#bodyGrad)" />

    <!-- Jersey Collar Accent -->
    <path d="M 68 80 Q 80 94 92 80 Q 80 86 68 80 Z" fill="url(#accentGrad)" />

    <!-- Jersey Stripe Accent -->
    <path d="M 77 92 L 83 92 L 83 140 L 77 140 Z" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>
